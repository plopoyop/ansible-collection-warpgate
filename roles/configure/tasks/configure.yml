---
- name: Handle Warpgate global parameters
  warpgate_parameters:
    host: "{{ warpgate_api_host }}"
    token: "{{ warpgate_api_token if (warpgate_api_token is defined and warpgate_api_token | length > 0) else omit }}"
    api_username: "{{ warpgate_admin_username | default(omit) }}"
    api_password: "{{ warpgate_admin_password | default(omit) }}"
    insecure: "{{ warpgate_api_insecure }}"
    allow_own_credential_management: "{{ warpgate_parameters.allow_own_credential_management | default(omit) }}"
    rate_limit_bytes_per_second: "{{ warpgate_parameters.rate_limit_bytes_per_second | default(omit) }}"
    ssh_client_auth_publickey: "{{ warpgate_parameters.ssh_client_auth_publickey | default(omit) }}"
    ssh_client_auth_password: "{{ warpgate_parameters.ssh_client_auth_password | default(omit) }}"
    ssh_client_auth_keyboard_interactive: "{{ warpgate_parameters.ssh_client_auth_keyboard_interactive | default(omit) }}"
    minimize_password_login: "{{ warpgate_parameters.minimize_password_login | default(omit) }}"
    ticket_self_service_enabled: "{{ warpgate_parameters.ticket_self_service_enabled | default(omit) }}"
    ticket_auto_approve_existing_access: "{{ warpgate_parameters.ticket_auto_approve_existing_access | default(omit) }}"
    ticket_max_duration_seconds: "{{ warpgate_parameters.ticket_max_duration_seconds | default(omit) }}"
    ticket_max_uses: "{{ warpgate_parameters.ticket_max_uses | default(omit) }}"
    ticket_require_description: "{{ warpgate_parameters.ticket_require_description | default(omit) }}"
    ticket_request_show_all_targets: "{{ warpgate_parameters.ticket_request_show_all_targets | default(omit) }}"
    target_click_action: "{{ warpgate_parameters.target_click_action | default(omit) }}"
    show_session_menu: "{{ warpgate_parameters.show_session_menu | default(omit) }}"
    password_policy: "{{ warpgate_parameters.password_policy | default(omit) }}"
    max_api_token_duration_seconds: "{{ warpgate_parameters.max_api_token_duration_seconds | default(omit) }}"
    record_scp: "{{ warpgate_parameters.record_scp | default(omit) }}"
  when: warpgate_parameters | length > 0

- name: Handle Warpgate roles
  warpgate_role:
    host: "{{ warpgate_api_host }}"
    token: "{{ warpgate_api_token if (warpgate_api_token is defined and warpgate_api_token | length > 0) else omit }}"
    api_username: "{{ warpgate_admin_username | default(omit) }}"
    api_password: "{{ warpgate_admin_password | default(omit) }}"
    insecure: "{{ warpgate_api_insecure }}"
    name: "{{ warpgate_current_role.name }}"
    description: "{{ warpgate_current_role.description | default('') }}"
    is_default: "{{ warpgate_current_role.is_default | default(omit) }}"
    state: "{{ warpgate_current_role.state | default('present') }}"
  loop: "{{ warpgate_roles }}"
  loop_control:
    loop_var: "warpgate_current_role"

- name: Handle Warpgate admin roles
  warpgate_admin_role:
    host: "{{ warpgate_api_host }}"
    token: "{{ warpgate_api_token if (warpgate_api_token is defined and warpgate_api_token | length > 0) else omit }}"
    api_username: "{{ warpgate_admin_username | default(omit) }}"
    api_password: "{{ warpgate_admin_password | default(omit) }}"
    insecure: "{{ warpgate_api_insecure }}"
    name: "{{ warpgate_current_admin_role.name }}"
    description: "{{ warpgate_current_admin_role.description | default('') }}"
    permissions: "{{ warpgate_current_admin_role.permissions | default({}) }}"
    state: "{{ warpgate_current_admin_role.state | default('present') }}"
  loop: "{{ warpgate_admin_roles }}"
  loop_control:
    loop_var: "warpgate_current_admin_role"

- name: Handle Warpgate users
  warpgate_user:
    host: "{{ warpgate_api_host }}"
    token: "{{ warpgate_api_token if (warpgate_api_token is defined and warpgate_api_token | length > 0) else omit }}"
    api_username: "{{ warpgate_admin_username | default(omit) }}"
    api_password: "{{ warpgate_admin_password | default(omit) }}"
    insecure: "{{ warpgate_api_insecure }}"
    username: "{{ warpgate_current_user.name }}"
    description: "{{ warpgate_current_user.description | default('') }}"
    rate_limit_bytes_per_second: "{{ warpgate_current_user.rate_limit_bytes_per_second | default(omit) }}"
    allowed_ip_ranges: "{{ warpgate_current_user.allowed_ip_ranges | default(omit) }}"
    credential_policy:
      http: "{{ warpgate_current_user.credential_policy.http | default([]) }}"
      ssh: "{{ warpgate_current_user.credential_policy.ssh | default([]) }}"
      mysql: "{{ warpgate_current_user.credential_policy.mysql | default([]) }}"
      postgres: "{{ warpgate_current_user.credential_policy.postgres | default([]) }}"
      kubernetes: "{{ warpgate_current_user.credential_policy.kubernetes | default([]) }}"
    password_credentials: "{{ warpgate_current_user.password_credentials | default([]) }}"
    public_key_credentials: "{{ warpgate_current_user.public_key_credentials | default([]) }}"
    sso_credentials: "{{ warpgate_current_user.sso_credentials | default(omit) }}"
    roles: "{{ warpgate_current_user.roles | default([]) }}"
    admin_roles: "{{ warpgate_current_user.admin_roles | default(omit) }}"
    state: "{{ warpgate_current_user.state | default('present') }}"
  loop: "{{ warpgate_users }}"
  loop_control:
    loop_var: "warpgate_current_user"

- name: Handle Warpgate target groups
  warpgate_group:
    host: "{{ warpgate_api_host }}"
    token: "{{ warpgate_api_token if (warpgate_api_token is defined and warpgate_api_token | length > 0) else omit }}"
    api_username: "{{ warpgate_admin_username | default(omit) }}"
    api_password: "{{ warpgate_admin_password | default(omit) }}"
    insecure: "{{ warpgate_api_insecure }}"
    name: "{{ warpgate_current_target_group.name }}"
    description: "{{ warpgate_current_target_group.description | default('') }}"
    color: "{{ warpgate_current_target_group.color | default('') }}"
    state: "{{ warpgate_current_target_group.state | default('present') }}"
  loop: "{{ warpgate_target_groups }}"
  loop_control:
    loop_var: "warpgate_current_target_group"

- name: Handle Warpgate targets
  warpgate_target:
    host: "{{ warpgate_api_host }}"
    token: "{{ warpgate_api_token if (warpgate_api_token is defined and warpgate_api_token | length > 0) else omit }}"
    api_username: "{{ warpgate_admin_username | default(omit) }}"
    api_password: "{{ warpgate_admin_password | default(omit) }}"
    insecure: "{{ warpgate_api_insecure }}"
    name: "{{ warpgate_current_target.name }}"
    group: "{{ warpgate_current_target.group | default('') }}"
    description: "{{ warpgate_current_target.description | default('') }}"
    rate_limit_bytes_per_second: "{{ warpgate_current_target.rate_limit_bytes_per_second | default(omit) }}"
    ssh_options: "{{ warpgate_current_target.ssh_options | default({}) }}"
    http_options: "{{ warpgate_current_target.http_options | default({}) }}"
    mysql_options: "{{ warpgate_current_target.mysql_options | default({}) }}"
    postgres_options: "{{ warpgate_current_target.postgres_options | default({}) }}"
    kubernetes_options: "{{ warpgate_current_target.kubernetes_options | default({}) }}"
    roles: "{{ warpgate_current_target.roles | default([]) }}"
    state: "{{ warpgate_current_target.state | default('present') }}"
  loop: "{{ warpgate_targets }}"
  loop_control:
    loop_var: "warpgate_current_target"

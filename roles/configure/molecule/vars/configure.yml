---
warpgate_api_host: "https://localhost:8888/@warpgate/admin/api/"
warpgate_api_insecure: true
warpgate_admin_username: "admin"
warpgate_admin_password: "molecule-admin-secret"

# Exercise the global parameters module, including the fields added in
# Warpgate 0.26 (login-protection), 0.27 (banner / web clients), 0.28
# (open_targets_in_new_tab) and 0.29 (MFA / default credential policy /
# session-approval). mfa_enforcement is left at "Off" so the admin can still
# authenticate against the API during the verify stage.
warpgate_parameters:
  allow_own_credential_management: false
  target_click_action: "ShowInstructions"
  open_targets_in_new_tab: "DefaultOff"
  banner: "Managed by Ansible molecule"
  login_protection_enabled: true
  lp_ip_max_attempts: 3
  record_desktop_keyboard_input: true
  mfa_enforcement: "Off"
  mfa_policy_exempt_sso_users: true
  admin_approval_timeout_seconds: 600
  default_credential_policy:
    ssh: ["PublicKey"]
    http: ["Password", "Totp"]

warpgate_roles:
  - name: "developers"
    description: "Role for development team"
  - name: "ops"
    description: "Role for ops team"

warpgate_admin_roles:
  - name: "auditor"
    description: "Read-only admin used by auditors"
    permissions:
      sessions_view: true
      recordings_view: true
  - name: "ops-admin"
    description: "Ops admin with target + user management"
    permissions:
      targets_create: true
      targets_edit: true
      targets_delete: true
      users_create: true
      users_edit: true

warpgate_users:
  - name: "Dave lopper"
    description: "Lead developer"
    roles:
      - "developers"
    rate_limit_bytes_per_second: 1048576
    allowed_ip_ranges:
      - "10.0.0.0/8"
      - "192.168.0.0/16"
  - name: "Amin Nistrator"
    description: "Administrator for production environment"
    roles:
      - "ops"
    admin_roles:
      - "ops-admin"
      - "auditor"

warpgate_target_groups:
  - name: "production"
    description: "Production environment servers"
    color: "Danger"
  - name: "development"
    description: "Development environment servers"
    color: "Success"

warpgate_targets:
  - name: "localhost-prod"
    description: "Production server"
    group: "production"
    rate_limit_bytes_per_second: 5242880
    roles:
      - "developers"
      - "ops"
    ssh_options:
      host: "localhost"
      port: 22
      username: "testuser"
      allow_insecure_algos: false
      password_auth:
        password: "testpassword"

---
- name: "Create initial configuration"
  ansible.builtin.command:
    argv: >-
      {{
        ["/bin/sh", "-c", 'IFS= read -r WARPGATE_ADMIN_PASSWORD && export WARPGATE_ADMIN_PASSWORD && exec "$@"', "sh",
         warpgate_executable_path, "--config", warpgate_config_file_path, "unattended-setup",
         "--data-path", warpgate_data_path,
         "--http-port", warpgate_http_port | string,
         "--database-url", warpgate_database_url,
         "--external-host", warpgate_external_host]
        + (["--ssh-port", warpgate_ssh_port | string] if warpgate_ssh_enabled else [])
        + (["--mysql-port", warpgate_mysql_port | string] if warpgate_mysql_enabled else [])
        + (["--postgres-port", warpgate_postgres_port | string] if warpgate_postgres_enabled else [])
        + (["--record-sessions"] if warpgate_record_sessions else [])
      }}
    creates: "{{ warpgate_config_file_path }}"
    stdin: "{{ warpgate_admin_password }}"
  become: true
  become_user: "{{ warpgate_system_user }}"
  no_log: true

- name: "Update config file"
  ansible.builtin.template:
    src: "etc/warpgate/warpgate.yaml.j2"
    dest: "{{ warpgate_config_file_path }}"
    owner: "{{ warpgate_system_user }}"
    group: "{{ warpgate_system_group }}"
    mode: "0600"
  diff: false
  notify:
    - "Restart Warpgate"

- name: "Ensure service is in correct state"
  ansible.builtin.service:
    name: "{{ warpgate_service_name }}"
    state: "{{ warpgate_service_state }}"
    enabled: "{{ warpgate_service_enabled }}"
  when: not ansible_check_mode

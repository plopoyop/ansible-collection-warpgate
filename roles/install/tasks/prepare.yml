---
# An error counts as configured: these paths may be controlled by the service user.
- name: "Check if Warpgate is already configured"
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  failed_when: false
  loop:
    - "{{ warpgate_configured_marker_path }}"
    - "{{ warpgate_config_file_path }}"
    - "{{ warpgate_setup_config_file_path }}"
    - "{{ (warpgate_sqlite_path ~ '/db.sqlite3') if warpgate_sqlite_path | length > 0 else warpgate_setup_config_file_path }}"
  register: "warpgate_configured_stat"

- name: "Check the TLS files unattended-setup would create"
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  failed_when: false
  loop:
    - "{{ warpgate_data_path }}/tls.certificate.pem"
    - "{{ warpgate_data_path }}/tls.key.pem"
  register: "warpgate_tls_stat"

- name: "Create Warpgate group"
  ansible.builtin.group:
    name: "{{ warpgate_system_group }}"
    system: true

- name: "Create Warpgate user"
  ansible.builtin.user:
    name: "{{ warpgate_system_user }}"
    group: "{{ warpgate_system_group }}"
    create_home: false
    shell: "/usr/sbin/nologin"
    system: true

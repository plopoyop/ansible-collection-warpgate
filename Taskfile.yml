---
version: '3'

vars:
  ROLES_LIST: ["install", "configure"]

tasks:
  default:
    cmds:
      - task -l
    silent: true

  prepare:
    desc: "Prepare development environment"
    cmds:
      - task: pre-commit

  pre-commit:
    desc: "Install pre-commit hooks"
    cmds:
      - prek install
    sources:
      - .git/hooks/pre-commit
      - .pre-commit-config.yaml
    generates:
      - .git/hooks/pre-commit
    method: checksum

  check:
    desc: "Run pre-commit hooks"
    cmds:
      - prek run -a

  lint:
    desc: "Run lint"
    cmds:
      - yamllint .
      - ansible-lint
      - ruff check plugins/ tests/

  test:modules:
    desc: "Run pytest for ansible modules"
    cmds:
      - PYTHONPATH=${PYTHONPATH}:${PWD} pytest tests/

  test:sanity:
    desc: "Run ansible-test sanity"
    cmds:
      - |
        dir="$(mktemp -d)"
        trap 'rm -rf "$dir"' EXIT
        dest="$dir/ansible_collections/plopoyop/warpgate"
        mkdir -p "$dest"
        git ls-files -z -co --exclude-standard --deduplicate \
          | xargs -0 sh -c 'for f do if [ -e "$f" ] || [ -L "$f" ]; then printf "%s\0" "$f"; fi; done' sh \
          | xargs -0 cp -P --parents -t "$dest"
        cd "$dest" && ansible-test sanity --color no {{.CLI_ARGS}}

  test:role:*:
    desc: "Run tests on a specific role"
    dir: 'roles/{{.ROLE_NAME}}'
    deps:
      - prepare
    cmds:
      - molecule test --all
    vars:
      ROLE_NAME: '{{index .MATCH 0}}'

  test:roles:all:
    desc: "Run tests on all roles"
    cmds:
      - for: { var: ROLES_LIST }
        task: test:role:{{.ITEM}}

  gen-doc:role:*:
    desc: "Run tests on a specific role"
    dir: 'roles/{{.ROLE_NAME}}'
    cmds:
      - ansible-doctor -f
    vars:
      ROLE_NAME: '{{index .MATCH 0}}'

  gen-doc:roles:all:
    desc: "Generate doc"
    cmds:
      - for: { var: ROLES_LIST }
        task: gen-doc:role:{{.ITEM}}

---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: detect-private-key

  - repo: https://github.com/adrienverge/yamllint.git
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530  # frozen: v1.38.0
    hooks:
      - id: yamllint
        files: \.(yaml|yml)$
        name: yamllint
        description: Run yamllint
        verbose: false

  - repo: local
    hooks:
      - id: ansible-lint
        name: ansible lint
        description: Run ansible-lint from the devbox-managed environment (avoids Nix/pre-commit venv collisions)
        entry: ansible-lint
        language: system
        files: \.(yaml|yml)$
        pass_filenames: false
        verbose: false

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: ef6cf06c079dd6b299dfc720b0f14400c9d168e1  # frozen: v0.17.5
    hooks:
      - id: ruff
        args: ["--fix", "./plugins/", "./tests/"]
      - id: ruff-format
        args: ["./plugins/", "./tests/"]

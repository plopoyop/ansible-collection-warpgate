---
name: Lint

on:
  push:
    branches: [main]
    paths:
      - 'roles/**'
      - 'plugins/**'
      - 'tests/**'
      - '.github/workflows/lint.yml'
      - '.ansible-lint'
      - '.yamllint'
      - 'ruff.toml'
  pull_request:
    branches: [main]
    paths:
      - 'roles/**'
      - 'plugins/**'
      - 'tests/**'
      - '.github/workflows/lint.yml'
      - '.ansible-lint'
      - '.yamllint'
      - 'ruff.toml'

permissions:
  contents: "read"

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install devbox
        uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
      - name: Run Linter
        run: devbox run -- task lint

---
name: Renovate

on:
  workflow_dispatch:
  schedule:
    - cron: "5 4 * * *"

permissions:
  contents: "read"

jobs:
  renovate:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Renovate
        uses: renovatebot/github-action@1376d90bcd3a4d4e7393ae762eea56ac684aee38 # v48.0.0
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_USERNAME: "plopoyop"
          RENOVATE_GIT_AUTHOR: "plopoyop <5174134+plopoyop@users.noreply.github.com>"
          LOG_LEVEL: "info"
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          configurationFile: "renovate.json"

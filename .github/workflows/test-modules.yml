---
name: "test modules"
on:
  push:
    branches: ["main"]
    paths:
      - "plugins/**"
      - "tests/**"
      - "meta/**"
      - "roles/**"
      - "galaxy.yml"
      - "devbox.json"
      - "devbox.lock"
      - "Taskfile.yml"
      - ".github/workflows/test-modules.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "plugins/**"
      - "tests/**"
      - "meta/**"
      - "roles/**"
      - "galaxy.yml"
      - "devbox.json"
      - "devbox.lock"
      - "Taskfile.yml"
      - ".github/workflows/test-modules.yml"

permissions:
  contents: "read"

jobs:
  test:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false
      - name: "Install devbox"
        uses: "jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7" # v0.15.0
      - name: "Prepare env"
        run: "devbox run -- task prepare"
      - name: "Run pytest"
        run: "devbox run -- task test:modules"

  sanity:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false
      - name: "Install devbox"
        uses: "jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7" # v0.15.0
      - name: "Run ansible-test sanity"
        run: "devbox run -- task test:sanity -- --docker default"

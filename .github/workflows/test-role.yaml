---
name: test role
on:
  workflow_call:
    inputs:
      role_name:
        required: true
        type: string

permissions:
  contents: "read"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install devbox
        uses: jetify-com/devbox-install-action@05e954310554b6122a26b4880d69937f61b1eb2e # v0.16.0
      - name: Prepare env
        run: devbox run -- task prepare
      - name: Run molecule test
        run: devbox run -- task "test:role:${ROLE_NAME}"
        env:
          ROLE_NAME: "${{ inputs.role_name }}"
          GITHUB_TOKEN: ${{ github.token }}

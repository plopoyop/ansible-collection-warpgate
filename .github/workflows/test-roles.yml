---
name: Test roles

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'roles/**'
      - '.github/**'
      - devbox.json
      - devbox.lock
  pull_request:
    branches: [main]
    paths:
      - 'roles/**'
      - '.github/**'
      - devbox.json
      - devbox.lock

permissions:
  contents: "read"

jobs:
  install:
    uses: ./.github/workflows/test-role.yaml
    with:
      role_name: "install"
  configure:
    uses: ./.github/workflows/test-role.yaml
    with:
      role_name: "configure"
